<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0417"/>
      <stop offset="60%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39ff14"/>
      <stop offset="55%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <clipPath id="sunClip"><circle cx="400" cy="150" r="78"/></clipPath>
  </defs>

  <rect x="0" y="0" width="800" height="320" fill="url(#sky)"/>

  <g fill="#86efac">
    <circle cx="90" cy="40" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="36" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="90" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="80" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <g clip-path="url(#sunClip)">
    <circle cx="400" cy="150" r="78" fill="url(#sun)" opacity="0.9"/>
    <g fill="#05070a">
      <rect x="320" y="150" width="160" height="4"/>
      <rect x="320" y="160" width="160" height="5"/>
      <rect x="320" y="172" width="160" height="6"/>
      <rect x="320" y="186" width="160" height="8"/>
      <rect x="320" y="202" width="160" height="10"/>
    </g>
  </g>

  <g stroke="#a855f7" stroke-width="1" opacity="0.6">
    <line x1="-60" y1="320" x2="400" y2="196"/><line x1="40" y1="320" x2="400" y2="196"/>
    <line x1="140" y1="320" x2="400" y2="196"/><line x1="240" y1="320" x2="400" y2="196"/>
    <line x1="340" y1="320" x2="400" y2="196"/><line x1="400" y1="320" x2="400" y2="196"/>
    <line x1="460" y1="320" x2="400" y2="196"/><line x1="560" y1="320" x2="400" y2="196"/>
    <line x1="660" y1="320" x2="400" y2="196"/><line x1="760" y1="320" x2="400" y2="196"/>
    <line x1="860" y1="320" x2="400" y2="196"/>
  </g>
  <g stroke="#39ff14" stroke-width="1.2">
    <line x1="0" x2="800" opacity="0.7"><animate attributeName="y1" values="198;320" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y2" values="198;320" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.9" dur="2.4s" repeatCount="indefinite"/></line>
    <line x1="0" x2="800" opacity="0.7"><animate attributeName="y1" values="198;320" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/><animate attributeName="y2" values="198;320" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.9" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/></line>
    <line x1="0" x2="800" opacity="0.7"><animate attributeName="y1" values="198;320" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/><animate attributeName="y2" values="198;320" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.9" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/></line>
    <line x1="0" x2="800" opacity="0.7"><animate attributeName="y1" values="198;320" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/><animate attributeName="y2" values="198;320" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.9" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/></line>
  </g>
  <line x1="0" y1="196" x2="800" y2="196" stroke="#39ff14" stroke-width="2"/>

  <g font-size="46" font-weight="bold" letter-spacing="4" text-anchor="middle">
    <text x="396" y="104" fill="#a855f7" opacity="0.8">NICOLAS
      <animate attributeName="opacity" values="0;0.8;0;0.5;0;0.7;0" keyTimes="0;0.05;0.1;0.5;0.55;0.6;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="404" y="104" fill="#ff6a00" opacity="0.7">NICOLAS
      <animate attributeName="opacity" values="0;0;0.7;0;0.6;0;0" keyTimes="0;0.04;0.09;0.12;0.52;0.57;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="104" fill="#39ff14">NICOLAS
      <animate attributeName="opacity" values="1;1;0.6;1;1;0.7;1" keyTimes="0;0.04;0.06;0.08;0.5;0.53;1" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>
  <text x="400" y="138" fill="#c084fc" font-size="18" font-weight="bold" letter-spacing="8" text-anchor="middle">R O M E R O</text>

  <text x="400" y="176" fill="#4ade80" font-size="12" letter-spacing="4" text-anchor="middle">⟨ FULL-STACK · GAME DEV · REAL-TIME SYSTEMS ⟩</text>

  <text x="400" y="300" fill="#ff8a1e" font-size="14" font-weight="bold" letter-spacing="5" text-anchor="middle">▶ PRESS START
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.3s" repeatCount="indefinite"/>
  </text>

  <rect x="0" width="800" height="10" fill="#39ff14" opacity="0.06">
    <animate attributeName="y" values="0;320" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
