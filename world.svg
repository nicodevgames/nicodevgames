<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <radialGradient id="boss" cx="40%" cy="36%" r="75%">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="38%" stop-color="#16a34a"/>
      <stop offset="70%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#a855f7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3b0764" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="bossClip"><circle cx="450" cy="185" r="85"/></clipPath>
  </defs>

  <!-- void -->
  <rect x="0" y="0" width="900" height="380" fill="#05070a"/>
  <ellipse cx="450" cy="190" rx="430" ry="260" fill="url(#neb)"/>

  <!-- matrix rain -->
  <g font-size="12" fill="#22c55e" opacity="0.22">
    <text x="80"><tspan x="80" dy="0">1</tspan><tspan x="80" dy="15">0</tspan><tspan x="80" dy="15">1</tspan><tspan x="80" dy="15">1</tspan><tspan x="80" dy="15">0</tspan>
      <animateTransform attributeName="transform" type="translate" values="0 -80;0 400" dur="7s" repeatCount="indefinite"/></text>
    <text x="250"><tspan x="250" dy="0">0</tspan><tspan x="250" dy="15">1</tspan><tspan x="250" dy="15">0</tspan><tspan x="250" dy="15">0</tspan><tspan x="250" dy="15">1</tspan>
      <animateTransform attributeName="transform" type="translate" values="0 -120;0 400" dur="9s" repeatCount="indefinite"/></text>
    <text x="650"><tspan x="650" dy="0">1</tspan><tspan x="650" dy="15">1</tspan><tspan x="650" dy="15">0</tspan><tspan x="650" dy="15">1</tspan><tspan x="650" dy="15">0</tspan>
      <animateTransform attributeName="transform" type="translate" values="0 -100;0 400" dur="8s" repeatCount="indefinite"/></text>
    <text x="840"><tspan x="840" dy="0">0</tspan><tspan x="840" dy="15">1</tspan><tspan x="840" dy="15">1</tspan><tspan x="840" dy="15">0</tspan><tspan x="840" dy="15">1</tspan>
      <animateTransform attributeName="transform" type="translate" values="0 -60;0 400" dur="6.5s" repeatCount="indefinite"/></text>
  </g>

  <!-- stars -->
  <g fill="#86efac">
    <circle cx="120" cy="40" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="35" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="18" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="210" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="200" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===== CONNECTION LINES — strong orange ===== -->
  <g stroke-width="1.8" fill="none">
    <line x1="450" y1="185" x2="150" y2="110" stroke="#ff6a00" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" values="20;0" dur="0.9s" repeatCount="indefinite"/></line>
    <line x1="450" y1="185" x2="760" y2="105" stroke="#ff6a00" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" values="20;0" dur="0.9s" repeatCount="indefinite"/></line>
    <line x1="450" y1="185" x2="120" y2="300" stroke="#ff6a00" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" values="20;0" dur="0.9s" repeatCount="indefinite"/></line>
    <line x1="450" y1="185" x2="790" y2="300" stroke="#ff6a00" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" values="20;0" dur="0.9s" repeatCount="indefinite"/></line>
    <line x1="450" y1="185" x2="450" y2="340" stroke="#ff6a00" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" values="20;0" dur="0.9s" repeatCount="indefinite"/></line>
  </g>
  <!-- order packets (orange) flowing OUT -->
  <g fill="#ff8a1e">
    <circle r="3.6"><animateMotion path="M450,185 L150,110" dur="2s" repeatCount="indefinite"/></circle>
    <circle r="3.6"><animateMotion path="M450,185 L760,105" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle r="3.6"><animateMotion path="M450,185 L120,300" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle r="3.6"><animateMotion path="M450,185 L790,300" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle r="3.6"><animateMotion path="M450,185 L450,340" dur="2s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===== NODES: dark planets + computer + hooded worker ===== -->
  <!-- P1 green -->
  <g transform="translate(150,110)">
    <circle r="34" fill="#0a1410" stroke="#22c55e" stroke-width="2"/>
    <ellipse cx="-8" cy="-10" rx="10" ry="5" fill="#16a34a" opacity="0.5"/>
    <g transform="translate(0,-34)"><rect x="-8" y="2" width="16" height="7" rx="2" fill="#0d1117"/><path d="M-6,-9 h12 v12 h-12 z M-6,-9 q6,-6 12,0" fill="#15311f" stroke="#22c55e" stroke-width="1"/><circle cx="0" cy="-12" r="4.5" fill="#1a3a26"/></g>
    <g transform="translate(22,-6)"><rect x="-7" y="-6" width="14" height="10" rx="1.5" fill="#05070a" stroke="#22c55e"/><rect x="-5" y="-4" width="10" height="2" fill="#39ff14"><animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/></rect></g>
  </g>
  <!-- P2 purple -->
  <g transform="translate(760,105)">
    <circle r="32" fill="#120a1a" stroke="#a855f7" stroke-width="2"/>
    <ellipse cx="-7" cy="-9" rx="9" ry="5" fill="#7c3aed" opacity="0.5"/>
    <g transform="translate(0,-32)"><rect x="-8" y="2" width="16" height="7" rx="2" fill="#0d1117"/><path d="M-6,-9 h12 v12 h-12 z M-6,-9 q6,-6 12,0" fill="#241233" stroke="#a855f7" stroke-width="1"/><circle cx="0" cy="-12" r="4.5" fill="#2e1a40"/></g>
    <g transform="translate(-22,-6)"><rect x="-7" y="-6" width="14" height="10" rx="1.5" fill="#05070a" stroke="#a855f7"/><rect x="-5" y="-4" width="10" height="2" fill="#c084fc"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.1s" repeatCount="indefinite"/></rect></g>
  </g>
  <!-- P3 green -->
  <g transform="translate(120,300)">
    <circle r="30" fill="#0a1410" stroke="#22c55e" stroke-width="2"/>
    <ellipse cx="-7" cy="-8" rx="9" ry="5" fill="#16a34a" opacity="0.5"/>
    <g transform="translate(0,-30)"><rect x="-8" y="2" width="16" height="7" rx="2" fill="#0d1117"/><path d="M-6,-9 h12 v12 h-12 z M-6,-9 q6,-6 12,0" fill="#15311f" stroke="#22c55e" stroke-width="1"/><circle cx="0" cy="-12" r="4.5" fill="#1a3a26"/></g>
    <g transform="translate(22,-4)"><rect x="-7" y="-6" width="14" height="10" rx="1.5" fill="#05070a" stroke="#22c55e"/><rect x="-5" y="-4" width="10" height="2" fill="#39ff14"><animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/></rect></g>
  </g>
  <!-- P4 purple -->
  <g transform="translate(790,300)">
    <circle r="32" fill="#120a1a" stroke="#a855f7" stroke-width="2"/>
    <ellipse cx="-7" cy="-9" rx="9" ry="5" fill="#7c3aed" opacity="0.5"/>
    <g transform="translate(0,-32)"><rect x="-8" y="2" width="16" height="7" rx="2" fill="#0d1117"/><path d="M-6,-9 h12 v12 h-12 z M-6,-9 q6,-6 12,0" fill="#241233" stroke="#a855f7" stroke-width="1"/><circle cx="0" cy="-12" r="4.5" fill="#2e1a40"/></g>
    <g transform="translate(-22,-6)"><rect x="-7" y="-6" width="14" height="10" rx="1.5" fill="#05070a" stroke="#a855f7"/><rect x="-5" y="-4" width="10" height="2" fill="#c084fc"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/></rect></g>
  </g>
  <!-- P5 green/purple -->
  <g transform="translate(450,340)">
    <circle r="30" fill="#0d0f18" stroke="#39ff14" stroke-width="2"/>
    <ellipse cx="-7" cy="-8" rx="9" ry="5" fill="#16a34a" opacity="0.5"/>
    <g transform="translate(0,-30)"><rect x="-8" y="2" width="16" height="7" rx="2" fill="#0d1117"/><path d="M-6,-9 h12 v12 h-12 z M-6,-9 q6,-6 12,0" fill="#241233" stroke="#a855f7" stroke-width="1"/><circle cx="0" cy="-12" r="4.5" fill="#2e1a40"/></g>
    <g transform="translate(22,-4)"><rect x="-7" y="-6" width="14" height="10" rx="1.5" fill="#05070a" stroke="#39ff14"/><rect x="-5" y="-4" width="10" height="2" fill="#39ff14"><animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/></rect></g>
  </g>

  <!-- running hooded people -->
  <g>
    <g>
      <animateMotion path="M-40,370 Q60,350 118,332" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="4s" repeatCount="indefinite"/>
      <rect x="-5" y="-14" width="10" height="11" rx="3" fill="#15311f" stroke="#22c55e" stroke-width="1"/><circle cx="0" cy="-17" r="4" fill="#1a3a26"/>
      <rect x="-5" y="-3" width="4" height="6" fill="#0d1117"><animate attributeName="height" values="6;3;6" dur="0.3s" repeatCount="indefinite"/></rect>
      <rect x="1" y="-3" width="4" height="6" fill="#0d1117"><animate attributeName="height" values="3;6;3" dur="0.3s" repeatCount="indefinite"/></rect>
    </g>
    <g>
      <animateMotion path="M940,372 Q840,352 788,332" dur="4.6s" begin="-1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="4.6s" begin="-1.5s" repeatCount="indefinite"/>
      <rect x="-5" y="-14" width="10" height="11" rx="3" fill="#241233" stroke="#a855f7" stroke-width="1"/><circle cx="0" cy="-17" r="4" fill="#2e1a40"/>
      <rect x="-5" y="-3" width="4" height="6" fill="#0d1117"><animate attributeName="height" values="6;3;6" dur="0.3s" repeatCount="indefinite"/></rect>
      <rect x="1" y="-3" width="4" height="6" fill="#0d1117"><animate attributeName="height" values="3;6;3" dur="0.3s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- ===== CENTRAL: NICOLAS — occult cyber core ===== -->
  <circle cx="450" cy="185" r="155" fill="url(#glow)"><animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/></circle>

  <!-- rotating runic ring -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 450 185;360 450 185" dur="36s" repeatCount="indefinite"/>
    <circle cx="450" cy="185" r="120" fill="none" stroke="#39ff14" stroke-width="1" opacity="0.35"/>
    <circle cx="450" cy="185" r="112" fill="none" stroke="#39ff14" stroke-width="1" opacity="0.2" stroke-dasharray="2 8"/>
    <g stroke="#39ff14" stroke-width="1.4" opacity="0.5">
      <line x1="450" y1="65" x2="450" y2="78"/><line x1="450" y1="292" x2="450" y2="305"/>
      <line x1="330" y1="185" x2="343" y2="185"/><line x1="557" y1="185" x2="570" y2="185"/>
      <line x1="365" y1="100" x2="374" y2="109"/><line x1="535" y1="100" x2="526" y2="109"/>
      <line x1="365" y1="270" x2="374" y2="261"/><line x1="535" y1="270" x2="526" y2="261"/>
    </g>
  </g>
  <!-- counter-rotating occult hexagram -->
  <g opacity="0.3" stroke="#a855f7" stroke-width="1.2" fill="none">
    <animateTransform attributeName="transform" type="rotate" values="360 450 185;0 450 185" dur="48s" repeatCount="indefinite"/>
    <polygon points="450,80 541,238 359,238"/>
    <polygon points="450,290 359,132 541,132"/>
  </g>

  <!-- core aura ping -->
  <circle cx="450" cy="185" r="90" fill="none" stroke="#39ff14" stroke-width="1.5" opacity="0.5">
    <animate attributeName="r" values="88;108;88" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- planet -->
  <circle cx="450" cy="185" r="85" fill="url(#boss)"/>
  <g clip-path="url(#bossClip)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-120 0" dur="16s" repeatCount="indefinite"/>
      <ellipse cx="420" cy="165" rx="30" ry="14" fill="#166534" opacity="0.7"/>
      <ellipse cx="500" cy="210" rx="24" ry="12" fill="#4c1d95" opacity="0.7"/>
      <ellipse cx="455" cy="230" rx="18" ry="9" fill="#166534" opacity="0.6"/>
      <ellipse cx="540" cy="165" rx="30" ry="14" fill="#166534" opacity="0.7"/>
      <ellipse cx="620" cy="210" rx="24" ry="12" fill="#4c1d95" opacity="0.7"/>
      <ellipse cx="575" cy="230" rx="18" ry="9" fill="#166534" opacity="0.6"/>
    </g>
  </g>
  <circle cx="450" cy="185" r="85" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.7"/>
  <ellipse cx="420" cy="150" rx="22" ry="13" fill="#86efac" opacity="0.15"/>

  <!-- NICOLAS nameplate (glitch) -->
  <g transform="translate(450,288)">
    <rect x="-88" y="-15" width="176" height="30" rx="6" fill="#05070a" stroke="#39ff14" stroke-width="2"/>
    <text x="0" y="-1" fill="#39ff14" font-size="15" font-weight="bold" letter-spacing="3" text-anchor="middle">NICOLAS
      <animate attributeName="opacity" values="1;1;0.4;1;1" keyTimes="0;0.4;0.45;0.5;1" dur="3s" repeatCount="indefinite"/></text>
    <text x="2" y="-1" fill="#a855f7" font-size="15" font-weight="bold" letter-spacing="3" text-anchor="middle" opacity="0">NICOLAS
      <animate attributeName="opacity" values="0;0;0.6;0;0" keyTimes="0;0.4;0.45;0.5;1" dur="3s" repeatCount="indefinite"/></text>
    <text x="0" y="11" fill="#ff8a1e" font-size="8" letter-spacing="2" text-anchor="middle">ROOT · MAIN SERVER</text>
  </g>

  <!-- NICOLAS avatar (hooded hacker + glasses) -->
  <g transform="translate(450,100)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3s" repeatCount="indefinite"/>
      <rect x="-8" y="-4" width="6" height="12" fill="#0f172a"/><rect x="2" y="-4" width="6" height="12" fill="#0f172a"/>
      <!-- hoodie body -->
      <rect x="-13" y="-27" width="26" height="25" rx="5" fill="#111827" stroke="#39ff14" stroke-width="1.5"/>
      <!-- raised commanding arm -->
      <rect x="11" y="-42" width="6" height="19" rx="3" fill="#111827" stroke="#39ff14" stroke-width="1" transform="rotate(28 14 -32)"/>
      <rect x="-17" y="-25" width="6" height="17" rx="3" fill="#111827" stroke="#39ff14" stroke-width="1"/>
      <!-- head + hood -->
      <rect x="-12" y="-49" width="24" height="23" rx="6" fill="#1a2332"/>
      <rect x="-9" y="-44" width="18" height="16" rx="4" fill="#0a0f16"/>
      <!-- neon glasses -->
      <circle cx="-5" cy="-37" r="4.5" fill="#05070a" stroke="#39ff14" stroke-width="1.5"/>
      <circle cx="6" cy="-37" r="4.5" fill="#05070a" stroke="#39ff14" stroke-width="1.5"/>
      <line x1="-0.5" y1="-37" x2="1.5" y2="-37" stroke="#39ff14" stroke-width="1.5"/>
      <circle cx="-5" cy="-37" r="1.6" fill="#39ff14"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="6" cy="-37" r="1.6" fill="#39ff14"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="-0.3s" repeatCount="indefinite"/></circle>
      <!-- occult sigil above -->
      <circle cx="0" cy="-58" r="6" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
      <polygon points="0,-63 4.5,-55 -4.5,-55" fill="none" stroke="#39ff14" stroke-width="0.9" opacity="0.8"/>
    </g>
  </g>

  <text x="450" y="373" fill="#4ade80" font-size="12" letter-spacing="3" text-anchor="middle">[ ENCRYPTED MESH ] · ALL NODES REPORT TO NICOLAS</text>
</svg>
